<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Stacked Bar Chart — dev harness</title>
        <style>
            body {
                margin: 0;
                padding: 24px;
                font-family:
                    ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: #f1f5f9;
                color: #0f172a;
            }
            .panel {
                max-width: 1100px;
                margin: 0 auto 24px;
                padding: 20px 24px;
                border-radius: 16px;
                background: #fff;
                box-shadow: 0 1px 2px rgb(15 23 42 / 6%), 0 12px 32px -12px rgb(15 23 42 / 18%);
            }
            .panel h2 {
                margin: 0 0 4px;
                font-size: 15px;
            }
            .panel p {
                margin: 0 0 16px;
                color: #64748b;
                font-size: 13px;
            }
            .toolbar {
                max-width: 1100px;
                margin: 0 auto 20px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .toolbar button {
                padding: 6px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                background: #fff;
                font: inherit;
                font-size: 13px;
                cursor: pointer;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #020617;
                    color: #e2e8f0;
                }
                .panel {
                    background: #0f172a;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
